# ---------- 正文页，按顺序 ----------
# 每页：title 标题 / sub 英文小标 / tagline 标题句 / body 正文段落 / folio 页脚 / image 照片 / side 照片在哪边 / edge 照片边缘处理
pages:
  - title: 一生一花 · Isshoikka
    sub: Ikebana · 禅花一味
    tagline: 通过「禅花一味」，由花的自然，体会生命的自然。
    body:
      - 「一生一花」始创于 2015 年，旨在于插花中融入禅境，以花为镜，照见自己。现有关注<a href="https://www.facebook.com/isshoikka">26 万</a>，硅谷线下工作坊广受好评。
      - 创始人玄光修习插花十余年，多次于日本京都池坊总部进修、参展，具池坊师范资质。玄光以禅修实践融入花艺创作中，令人体悟与自然合一的深层喜悦；进而把「禅花一味」的领悟带入日常生活中，获得更多的自适、自洽和自然。
    folio: 01 · 一生一花
    image: oncidium
    side: L
    edge: near

  - title: 止语
    sub: Silence · 工作坊
    tagline: 没有手机，没有说话，没有预设或评判。
    body:
      - 拈花，凝视，裁剪，安置。每一个当下即是觉知，每一份宁静即是感动。
      - quote: 「在很安静很流动的环境里，感受植物本来的美。在每一下修枝叶的落剪时，都在感受植物本身的美。通过整理花材去顺应花道的框架的过程中，也是整理内心对于何为自然何为美的一场内观之旅。」—— 学员 C.
    folio: 01 · 一生一花
    image: workshop
    side: R

  - title: 一枝见天地
    sub: One stem, the whole world
    body:
      - label: 见无常：
        text: 「立于吹散花朵、剥落枝叶的风前，便可能领受开悟的种子。」
      - label: 见自然：
        text: 「让自身去聆听自然之无声而又隐秘的秩序。」
      - label: 见合一：
        text: 「天然之姿为表现之本，其中蕴含我们印象的理想之像。」
      - quote: 「随着专注地去观察与修剪，才发现看似单一的花材竟然能展现出如此不同的风骨。过程中甚至触发了许多关于哲学与人生的领悟。」—— 学员 K.
    folio: 01 · 一生一花
    image: rose_top10
    edge: wall+ink

  - kind: sanmi                  # 三味页（无图，三句 + 结语）
    lines:
      - 世间的插花，追求感官的享受；
      - 出世的插花，追求情感的共鸣；
      - 究竟的插花，是人与自然的合一。
    closing: 花的自然，即是人的自然。
    folio: 01 · 一生一花

  - title: 落星集
    sub: Poetry · 九歌诗社
    tagline: 星辰落地化为文字；淬炼文字复归星辰。
    body:
      - 玄光笔耕二十余年，每有所感，常以诗记之。多写光阴四季，沧海桑田，山川花草，日月星辰。不重雕琢，随心所至，而与天地交通，屡有出尘之思。近作常以禅入诗，直溯本源。
      - 存诗千首。见录于<a href="https://haoshou.app">「落星集」</a>。
      - 2022 年于谷歌联合创立「九歌诗社」，多次组织线上线下雅集、古诗词普及活动及诗词创作分享，影响数千人。
    folio: 02 · 落星集
    image: poem

  - title: 太玄琴社
    sub: Music · Guqin
    tagline: 目送归鸿，手挥五弦；俯仰自得，游心太玄。
    body:
      - 「太玄琴社」始创于 2022 年，旨在于琴声中体会天人合一。重古朴，轻浮华，推崇自然、不造作的音乐；在演奏中体察内在情感的流动，进而与自然合而为一。
      - 玄光尤擅古谱考校，亦通箫、钢琴。琴社多次巡演硅谷在地文艺集会，历年受邀山景城市政府参与新春演出。现有社员百余人。
    folio: 03 · 太玄琴社
    image: guqin
    side: R
    edge: deckle

  - title: 书法篆刻
    sub: Calligraphy · Seal Carving
    tagline: 一笔一划，亦方亦圆；外师造化，中得心源。
    body:
      - 书法是纸与墨的交融，篆刻是金与石的碰撞。一笔一划之间，是心与自然的合一。
      - 玄光自幼受家庭熏陶学习书画篆刻艺术，书从楷篆，印尚自然。在一笔一划的宁静中，雕琢和工巧渐渐褪去，唯留内心最纯粹的本然。
    folio: 04 · 书法篆刻
    image: seal
    side: L
    edge: deckle2:77:20       # 左右都撕边；两个数字是撕口的随机种子，改了形状就变
    inset: 160                # 照片离左页边 160px，与封面相同

  - title: 设计创造
    sub: Creation · 陶艺 · 木工 · 设计 · 建造
    tagline: 通过创作抵达生命的源泉。
    body:
      - 玄光亦涉猎陶艺、纸艺、木工、车制木碗等。尤擅侘寂风格的设计及落地，在创造中体会与生命本源的链接。
    folio: 05 · 设计创造
    image: [attic_render, attic_photo]      # 上下两图
    side: R
    edge: bar:10:#4a2b23                    # 照片左缘贴一道 10px 实线，颜色取自实物图里榻榻米的缘

  - title: Lumilab.AI
    sub: Technology
    tagline: 融合前沿 AI 科技和传统智慧，推动内在探索生活化，成为每一个当下的主人。
    body:
      - 当今物质富足，科技进步，可人们的精神健康却每况愈下。Lumilab.AI 创立于 2025 年，立足于结合最新的 AI 技术和传统智慧，帮助人们了解自己的内在系统，尤其是觉知和调控自己的情绪，塑造更加稳定、自洽、幸福的生活。
    folio: 06 · Lumilab
    image: lumilab
    side: L
    edge: fade

  - title: 能量水晶
    sub: Crystal
    tagline: 通过造物的精华，体会生命的振动。
    body:
      - 水晶是天地能量的结晶，回响宇宙的频率，蕴含灵性的启发。水晶的洁净亦能洗涤灵魂，帮助深入探索内在的旅程。Starlia 受到水晶的感召，通过全球最纯净的能量点，帮助有缘人链接到他们的灵魂伴侣。
    folio: 07 · 能量水晶
    image: crystal_sq
    side: R
    edge: grain:176

  - title: 器物收藏
    sub: Objects · 古董 · 茶器 · 花器 · 香炉 · 卷轴
    tagline: 美丽的灵魂超越时空，跨越千古见证生命永恒。
    body:
      - 器物是沧海桑田的见证。斯人已逝，而他们的精神和情感通过器物流转，千年后依旧启发并鼓舞着后人。细查传承之不朽，即能了悟生命之永恒。
      - Starlia 专注于收藏富含人文情感和温度的古董，包括茶器、花器、瓷器、铁器、香炉、卷轴等，从跨越沧桑的见证中播撒探寻内在不朽的种子。
    folio: 08 · 器物收藏
    image: objects
    side: L
    edge: deckle

  - kind: zen                    # 禅修页（无图，横排居中）
    title: 生命的本质，是超越的智慧。
    sub: Zen · 禅修探索
    body:
      - 2023 年一次机缘巧合，玄光走上了禅修的道路。至此先前所学融会贯通，从而找到了人生的方向：探索那个圆满完美的内在源泉。
      - Starlia 深信：生命的本质，是超越的智慧，体现出一切美好的品质。而当我们带有觉知，所有的一切都能成为通向那美好本质的道路。希望所有人都能走上这条光明之路。
    folio: 09 · 禅修探索

  - title: 玄光
    halign: center         # 文字块在照片旁的留白中左右居中
    sub: Xuan Guang
    body:
      - 玄光，本名钱力，祖籍杭州，现定居美国硅谷。浙江大学竺可桢学院、香港大学学士，密歇根大学计算机硕士、博士。供职脸书、谷歌十余年，任工程师经理。
      - 家学渊源，自幼受文艺熏陶，涉猎诗歌、音乐、书法、篆刻、花道、茶道、剑道、陶艺、木艺、纸艺、汉服、收藏等。创立一生一花、太玄琴社、九歌诗社、Ocean & Morus、Starlia、Lumilab.AI、内在探索研究实验室。
      - 多年坚持禅修、实修，大量从事志愿工作，致力于把生命内在探索融入到各个领域，启发人类成就圆满、完美、幸福、快乐的生命。
    image: portrait
    side: R

