pages:
  - title: Isshoikka
    sub: Ikebana · One Life, One Flower
    tagline: "Zen and flower, one taste: in the nature of a flower, we meet the nature of life."
    body:
      - Isshoikka began in 2015 to bring Zen into the practice of ikebana — the flower as a mirror in which we see ourselves. It now has <a href="https://www.facebook.com/isshoikka">260,000 followers</a>, and its workshops in Silicon Valley are warmly received.
      - Its founder, Xuan Guang, has practiced ikebana for more than a decade, studying and exhibiting many times at the Ikenobo headquarters in Kyoto, and holds the Ikenobo teaching license. Zen practice flows into every arrangement, opening a deep and quiet joy of being one with nature. Carried into daily life, this same “Zen and flower, one taste” becomes more ease, more coherence, more naturalness.
    folio: 01 · Isshoikka
    image: oncidium
    side: L
    edge: near

  - title: Silence
    sub: Workshop · Isshoikka
    tagline: No phones. No talking.<br>No assumptions, no judgment.
    body:
      - Pick up the flower. Look. Cut. Place. Every moment is awareness; every stillness, a quiet joy.
      - quote: “In a space so quiet and so fluid, I felt the beauty of plants as they are. With every cut of a branch or leaf, I was feeling the plant itself. Arranging the material to follow the form of ikebana became a journey inward, asking what is natural and what is beautiful.” — Student C.
    folio: 01 · Isshoikka
    image: workshop
    side: R

  - title: One Stem, the Whole World
    valign: middle
    sub: Ikebana · Three Ways of Seeing
    body:
      - label: "Impermanence · "
        text: “Standing before the wind that scatters blossoms and strips the leaves, one may receive the seed of awakening.”
      - label: "Nature · "
        text: “Let yourself listen to the silent, hidden order of nature.”
      - label: "Oneness · "
        text: “The natural form is the root of expression; within it lies the ideal image of what we perceive.”
      - quote: “Observing and trimming with full attention, I found that a single material could show such different character. Along the way it opened many reflections on philosophy and on life.” — Student K.
    folio: 01 · Isshoikka
    image: rose_top10
    edge: wall+ink
    width: 560

  - kind: sanmi
    lines:
      - Worldly ikebana seeks the pleasure of the senses;
      - transcendent ikebana seeks the resonance of feeling;
      - ultimate ikebana is the oneness of human and nature.
    closing: The nature of the flower is our own nature.
    folio: 01 · Isshoikka

  - title: Falling Stars
    valign: bottom
    sub: Poetry · Jiuge Poetry Society
    tagline: Stars fall to earth as words; words, refined, return as stars.
    body:
      - For more than twenty years Xuan Guang has written poetry whenever something moved the heart — the turning seasons, seas becoming fields, mountains and rivers, grasses and flowers, sun, moon and stars. Not polished for its own sake, but written as the heart goes, in conversation with heaven and earth, often reaching beyond the dust of the world. Recent poems carry Zen into verse, tracing back to the source.
      - Over a thousand poems, collected in <a href="https://haoshou.app">Falling Stars</a>.
      - In 2022, co-founded the Jiuge Poetry Society at Google — gatherings online and in person, introductions to classical poetry, and the sharing of new work — reaching more than a thousand people.
    folio: 02 · Falling Stars
    image: poem
    width: 540
    x: 863                 # right edge stays at 1403 (gap 197), left gap 136

  - title: Taixuan Guqin Society
    sub: Music · Guqin
    tagline: Eyes follow the returning geese, hands sweep the five strings; at ease, the mind roams the great mystery.
    body:
      - The Taixuan Guqin Society began in 2022, to find in the sound of the qin the unity of heaven and humankind. We prize the plain over the ornate — music that is natural and unforced. In playing, we watch the movement of feeling within, and become one with nature.
      - The society has performed widely at cultural gatherings across Silicon Valley and is invited each year by the City of Mountain View for its Lunar New Year celebration. It now has more than a hundred members.
    folio: 03 · Taixuan Guqin
    image: guqin
    side: R
    edge: deckle
    align: near            # the player looks left: text sits toward the photo
    width: 620

  - title: Energy Crystals
    valign: 0.333
    sub: Crystal
    tagline: Through the essence of creation, feel the vibration of life.
    body:
      - Crystals are the condensed energy of heaven and earth. They echo the frequencies of the universe and carry a quiet spiritual inspiration. Their purity can also cleanse the soul and support the journey inward. Called by the crystals, Starlia draws on the purest energy points on earth to help kindred spirits find their soulmate.
    folio: 04 · Energy Crystals
    image: crystal_sq
    side: R
    edge: grain:176

  - title: Lumilab.AI
    sub: Technology
    tagline: Frontier AI meets traditional wisdom, bringing inner exploration into daily life — so that each of us can be the master of the present moment.
    body:
      - We live amid material abundance and rapid technological progress, yet mental health keeps declining. Lumilab.AI was founded in 2025 to join the latest AI with traditional wisdom — helping people understand their inner system, above all to be aware of and to regulate their emotions, and to build a steadier, more coherent and happier life.
    folio: 05 · Lumilab
    image: lumilab
    side: L
    edge: fade

  - title: Design & Making
    valign: 0.333          # free space 1/3 above, 2/3 below
    sub: Creation · Ceramics · Woodwork · Design · Building
    tagline: Through making, we reach the source of life.
    body:
      - Xuan Guang also works in ceramics, woodwork and bowl turning, with a particular feel for wabi-sabi design and for building it in the real world — finding, in the act of making, a connection to the source of life.
    folio: 06 · Design & Making
    image: [attic_render, attic_photo]
    side: R
    edge: bar:10:#4a2b23

  - title: Collected Objects
    sub: Objects · Antiques · Tea Ware · Vessels · Censers · Scrolls
    tagline: Beautiful souls outlast time; across a thousand years they bear witness to the permanence of life.
    body:
      - Objects are witnesses to seas turning into fields. Their makers are gone, yet their spirit and feeling flow on through what they made, still inspiring people a thousand years later. Look closely at what endures through inheritance, and you glimpse the permanence of life.
      - Starlia collects antiques rich in human feeling and warmth — tea ware, flower vessels, porcelain, ironware, censers, scrolls — and from these witnesses of time sows the seed of searching for what is imperishable within.
    folio: 07 · Objects
    image: objects
    side: L
    edge: deckle

  - kind: zen
    title: The essence of life is transcendent wisdom.
    sub: Zen · Practice
    body:
      - "In 2023, by a turn of fate, Xuan Guang set out on the path of Zen practice. Everything learned before fell into place, and the direction of life became clear: to explore that perfect and complete inner source."
      - "Starlia holds this: the essence of life is transcendent wisdom, and it shows itself in every good quality. When we bring awareness, everything becomes a path toward that beautiful essence. May everyone walk this path of light."
    folio: 08 · Zen

  - title: Xuan Guang
    sub: Li Qian
    body:
      - Xuan Guang, born Li Qian, has family roots in Hangzhou and lives in Silicon Valley. Bachelor’s degrees from Zhejiang University and the University of Hong Kong; master’s and PhD in computer science from the University of Michigan. More than ten years at Facebook and Google as an engineering manager.
      - Raised in a family steeped in the arts, with interests spanning poetry, music, ikebana, tea, kendo, ceramics, woodwork, hanfu and collecting. Founder of Isshoikka, the Taixuan Guqin Society, the Jiuge Poetry Society, Ocean & Morus, Starlia, Lumilab.AI and the Inner Exploration Lab.
      - Many years of sustained Zen practice and volunteer work, devoted to bringing inner exploration into every field — to inspire a life that is whole, complete, happy and joyful.
    image: portrait
    side: R

