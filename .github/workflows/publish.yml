name: build & publish
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Fonts (Noto Serif CJK SC, from the repo's `fonts` branch)
        uses: actions/checkout@v4
        with:
          ref: fonts
          path: fonts
      - name: Register fonts
        run: mkdir -p ~/.local/share/fonts && cp fonts/*.otf ~/.local/share/fonts/ && fc-cache -f && fc-list | grep -c "Noto Serif CJK SC"
      - name: Python deps
        run: pip install -q -r requirements.txt
      - name: Cache Chromium
        id: chromium
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-1.63.0
      - name: Install Chromium
        if: steps.chromium.outputs.cache-hit != 'true'
        run: python -m playwright install --with-deps chromium
      - name: Chromium system deps (cache hit)
        if: steps.chromium.outputs.cache-hit == 'true'
        run: python -m playwright install-deps chromium
      - name: Build PDF + site
        run: |
          python build.py
          rm -f web/artifact.html
      - name: Publish web/ to the gh-pages branch
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./web
          force_orphan: true
